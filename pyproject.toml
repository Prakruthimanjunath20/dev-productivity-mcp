[project]
name = "dev-productivity-mcp"
version = "0.1.0"
description = "An MCP server that gives AI assistants read-only developer-productivity tools: repo overviews, standups, changelogs, TODO scans, branch health and pull request summaries."
readme = "README.md"
license = "MIT"
authors = [{ name = "Prakruthi Manjunath" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.12",
]

[project.scripts]
dev-productivity-mcp = "dev_productivity_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_productivity_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
